###############################################################################
# FERRUM — Kong declarative config (self-hosted Supabase gateway)
#
# This file is SAFE TO COMMIT: every secret here is a ${VAR} placeholder,
# resolved from the kong container's own environment at startup (see the
# `entrypoint:` bash trick in ../../docker-compose.yml). The resolved file
# only ever exists inside the running container — never written back here.
###############################################################################

_format_version: "2.1"

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # ── Auth (GoTrue) — protected routes ───────────────────────────────────────
  # /token, /user, /logout, /admin/* etc. all require an apikey.
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ── Auth (GoTrue) — OPEN routes ─────────────────────────────────────────────
  # Email confirmation links, password-recovery links, and OAuth redirects hit
  # these directly from the user's browser — they never carry an apikey header.
  # Gating them behind key-auth would break every signup/reset/invite email.
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open-verify
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors

  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  # ── REST (PostgREST) ─────────────────────────────────────────────────────
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ── Storage ───────────────────────────────────────────────────────────────
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  # ── Edge Functions ──────────────────────────────────────────────────────────
  # No key-auth here, by design — confirmed against Supabase's own reference
  # Kong config (checked directly on this repo's CLI-managed dev stack): the
  # functions route carries no apikey requirement at all, only CORS. Every
  # existing call site in both apps sends `Authorization: Bearer <user-jwt>`
  # and nothing else — adding key-auth here would break every one of them.
  # Auth is left entirely to each function: most verify the caller's JWT
  # themselves (supabase.auth.getUser()); stripe-webhook instead verifies the
  # Stripe-Signature header, so it needs no special-cased route either.
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

# No routes for pg-meta or Studio — both are internal-only, reachable solely
# via SSH tunnel to their 127.0.0.1 host ports (see docker-compose.yml).
